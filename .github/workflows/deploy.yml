name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]

  # Дозволяє запускати workflow вручну зі вкладки Actions
  workflow_dispatch:

# Надаємо права токену GITHUB_TOKEN для публікації у GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Дозволяє лише один активний деплой одночасно
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4